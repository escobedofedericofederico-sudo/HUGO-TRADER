name: HUGO-TRADER BTC-USD walk-forward

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  btc-walk-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: python -m pip install --upgrade pip yfinance pandas

      - name: Download two years of daily BTC-USD prices
        run: |
          mkdir -p data reports
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          import yfinance as yf

          ticker = "BTC-USD"
          frame = yf.Ticker(ticker).history(period="2y", interval="1d", auto_adjust=False)
          if frame.empty or "Close" not in frame:
              raise SystemExit("No se recibieron precios históricos de Yahoo Finance.")
          frame = frame.dropna(subset=["Close"]).copy()
          frame.index = frame.index.strftime("%Y-%m-%d")
          output = frame[["Close"]].rename_axis("date").reset_index()
          output.to_csv("data/BTC-USD-2y-daily.csv", index=False)
          metadata = {
              "ticker": ticker,
              "source": "Yahoo Finance via yfinance",
              "interval": "1d",
              "period_requested": "2y",
              "rows": len(output),
              "first_date": output.iloc[0]["date"],
              "last_date": output.iloc[-1]["date"],
              "downloaded_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          with open("reports/data_metadata.json", "w", encoding="utf-8") as f:
              json.dump(metadata, f, indent=2)
          print(json.dumps(metadata, indent=2))
          if len(output) < 180:
              raise SystemExit("Insufficient historical rows for a meaningful walk-forward test.")
          PY

      - name: Run HUGO-TRADER walk-forward
        run: |
          python research_lab.py data/BTC-USD-2y-daily.csv --train 120 --test 30 --step 30 --capital-ars 20000 --fee 0.001 | tee reports/walk_forward.txt

      - name: Upload prices and research report
        uses: actions/upload-artifact@v4
        with:
          name: HUGO-TRADER-BTC-USD-2Y-report
          path: |
            data/BTC-USD-2y-daily.csv
            reports/
          if-no-files-found: error
          retention-days: 30
